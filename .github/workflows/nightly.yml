name: Nightly

# Automatic bleeding-edge builds of the newest `main`, published every day.
#
# Unlike release.yml (which is run by hand and builds every platform, then sits
# as a draft for testers), the nightly runs on a schedule and publishes itself as
# a pre-release so players can grab today's changes without compiling. It builds
# only Windows and Linux: macOS GitHub runners are frequently unavailable
# ("not acquired by Runner of type hosted"), and a nightly that silently lacks
# macOS is acceptable here -- the macOS build still ships from release.yml, and a
# nightly's whole point is "newest code", not "every platform".
#
# Two kinds of run:
#   schedule   -- every day at the cron below (UTC). Builds and auto-publishes a
#                 pre-release named nightly-<build time>.
#   dispatch   -- run by hand from the Actions tab, for testing. `publish`
#                 chooses the mode: `prerelease` publishes it, `none` only keeps
#                 the archives as workflow artifacts.
#
# Archives hold the game program, config.toml.example, the license, the
# third-party notices (THIRD_PARTY_LICENSES.html) and a README.txt made from
# .github/release/README.txt.in -- never any game files (see release.yml).
#
# Reuses release.yml's prepare/build/publish shape and the same .github/release
# helpers (tag.sh, notes.sh), so the two stay consistent.
on:
  schedule:
    # 18:00 UTC == 02:00 Beijing. GitHub may delay scheduled runs under load,
    # so do not rely on the exact minute.
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish how? "none" only uploads workflow artifacts.'
        type: choice
        options: [prerelease, none]
        default: prerelease

# One run at a time: a long Windows+Linux build should finish before the next
# day's run starts. By default a newer run queues behind the running one.
concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  # rust-lld links much faster than link.exe and statically links the C runtime,
  # removing the need for VCRUNTIME140.dll. x86-64 Windows only.
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
  MACOSX_DEPLOYMENT_TARGET: '11.0'

jobs:
  # One cheap job decides the names and publish mode, so the build and publish
  # jobs agree on a date that will not roll over midnight mid-run.
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.names.outputs.version }}
      stamp: ${{ steps.names.outputs.stamp }}
      sha: ${{ steps.names.outputs.sha }}
      tag: ${{ steps.names.outputs.tag }}
      publish: ${{ steps.names.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Decide version, build time, sha, tag and publish mode
        id: names
        shell: bash
        env:
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$version" ]; then
            echo "No [package] version found in Cargo.toml" >&2
            exit 1
          fi
          # UTC keeps archive names identical for maintainers in any timezone.
          # YYYYMMDD-HHMMSS: sortable, and unique per day so the tag never
          # collides with a previous nightly.
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          sha="$(git rev-parse --short=7 HEAD)"
          tag="nightly-$stamp"
          # Scheduled runs have no dispatch input, so default to publishing;
          # a manual run honors its chosen mode.
          publish="${INPUT_PUBLISH:-prerelease}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          {
            echo "### Nightly plan"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| version | \`$version\` |"
            echo "| build time | \`$stamp\` (UTC) |"
            echo "| build commit | \`$sha\` |"
            echo "| tag | \`$tag\` |"
            echo "| publish | \`$publish\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            program: vera20k.exe
          # The oldest supported Ubuntu runner, so the build also runs on
          # distributions with an older glibc.
          - os: ubuntu-22.04
            target: linux-x64
            program: vera20k
    steps:
      # The program embeds text files (shaders, the capture contract); keep
      # their LF bytes instead of the Windows runner's CRLF checkout.
      - name: Check out with LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      # Before the build, so a crate with an unrecognized or GPL-incompatible
      # license stops the release early (.github/release/about.toml).
      - name: Third-party license notices
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cargo about generate --locked --fail -c .github/release/about.toml \
            -o dist/THIRD_PARTY_LICENSES.html .github/release/about.hbs
      - uses: Swatinem/rust-cache@v2
      # The AppImage step also needs rsvg-convert and desktop-file-validate.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config librsvg2-bin desktop-file-utils
      - name: Build the game
        # Shipped binaries leave out the default `dev-overlays`, and use the
        # whole-program `shipping` profile (Cargo.toml).
        run: cargo build --profile shipping --locked -p vera20k --no-default-features --bin vera20k
      - name: Package
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          STAMP: ${{ needs.prepare.outputs.stamp }}
          SHA7: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          # Name = version + platform + build time + the commit built.
          name="vera20k-${VERSION}-${{ matrix.target }}-${STAMP}-${SHA7}"
          mkdir -p "dist/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          cp "target/shipping/${{ matrix.program }}" config.toml.example LICENSE-GPL \
            dist/THIRD_PARTY_LICENSES.html "dist/$name/"
          sed -e "s/@VERSION@/${VERSION}/" -e "s/@BUILD@/${STAMP}/" \
            .github/release/README.txt.in > "dist/$name/README.txt"

          # Files sit at the archive root so they can be extracted straight into
          # the game folder.
          cd "dist/$name"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip "../$name.zip" ./* > /dev/null
          else
            tar -czf "../$name.tar.gz" ./*
          fi
      # Windows also gets an installer of the same files: it finds the Yuri's
      # Revenge folder and writes config.toml (.github/release/windows).
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          STAMP: ${{ needs.prepare.outputs.stamp }}
          NAME: ${{ steps.package.outputs.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Inno Setup 6 comes with the runner image (actions/runner-images).
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $dist = (Resolve-Path dist).Path
          & $iscc "/DAppVersion=$env:VERSION" "/DBuild=$env:STAMP" `
            "/DPackageDir=$dist\$env:NAME" "/DOutputDir=$dist" `
            "/DOutputBaseFilename=$env:NAME-setup" .github\release\windows\vera20k.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
      # Install, upgrade and uninstall silently against stand-in game folders, so
      # a broken installer stops the nightly here instead of reaching players.
      - name: Test the Windows installer
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          NAME: ${{ steps.package.outputs.name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path "dist\$env:NAME-setup.exe").Path
          $root = Join-Path $env:RUNNER_TEMP 'installer-test'
          $app = Join-Path $root 'VERA20k'
          $log = Join-Path $root 'setup.log'
          New-Item -ItemType Directory -Force $root | Out-Null
          function Install([string]$Game) {
            $arguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=`"$log`"",
              "/DIR=`"$app`"")
            if ($Game) { $arguments += "/GAMEDIR=`"$Game`"" }
            $p = Start-Process $setup -Wait -PassThru -ArgumentList $arguments
            return $p.ExitCode
          }
          function New-Game([string]$Dir) {
            if (-not [IO.Path]::IsPathRooted($Dir)) { $Dir = Join-Path $root $Dir }
            New-Item -ItemType Directory -Force $Dir | Out-Null
            foreach ($f in 'ra2md.mix', 'ra2.mix') { Set-Content (Join-Path $Dir $f) '' }
            return $Dir
          }
          function Read-Config { Get-Content (Join-Path $app 'config.toml') -Raw -Encoding utf8 }
          function Ra2Dir([string]$Dir) { 'ra2_dir = "' + ($Dir -replace '\\', '/') + '"' }
          function Assert-Found([string]$Dir) {
            $config = Read-Config
            if (-not $config.Contains((Ra2Dir $Dir))) {
              Get-Content $log -Encoding utf8 | Select-String 'Steam|Yuri'
              $config -split "`n" | Select-String '^ra2_dir'
              throw "setup did not find $Dir"
            }
          }
          $yuri = -join [char[]](0x5C24, 0x91CC, 0x7684, 0x590D, 0x4EC7)
          $commander = -join [char[]](0x6307, 0x6325, 0x5B98)

          $empty = Join-Path $root 'empty'
          New-Item -ItemType Directory -Force $empty | Out-Null
          if ((Install $empty) -eq 0) { throw 'setup accepted a folder without Yuri''s Revenge' }
          if (Test-Path (Join-Path $app 'vera20k.exe')) { throw 'a refused setup installed files' }

          $first = New-Game 'game one'
          $code = Install $first
          if ($code -ne 0) { Get-Content $log; throw "setup failed with exit code $code" }
          foreach ($f in 'vera20k.exe', 'config.toml', 'config.toml.example', 'README.txt',
                         'LICENSE-GPL', 'THIRD_PARTY_LICENSES.html') {
            if (-not (Test-Path (Join-Path $app $f))) { throw "setup did not install $f" }
          }
          $config = Read-Config
          if (-not $config.Contains((Ra2Dir $first))) { throw "config.toml lacks $(Ra2Dir $first)" }
          if ($config -notmatch '(?m)^settings_dir = "\."\r?$') { throw 'config.toml lacks settings_dir = "."' }
          $exe = Join-Path $app 'vera20k.exe'
          Add-Type -Namespace Win32 -Name Shell -MemberDefinition @'
          [DllImport("shell32.dll", CharSet = CharSet.Unicode)]
          public static extern uint ExtractIconEx(string file, int index, IntPtr[] large, IntPtr[] small, uint count);
          '@
          if ([Win32.Shell]::ExtractIconEx($exe, -1, $null, $null, 0) -lt 1) { throw 'vera20k.exe has no icon' }
          $details = (Get-Item $exe).VersionInfo
          if ($details.ProductName -ne 'VERA20k' -or $details.ProductVersion -ne $env:VERSION) {
            throw "vera20k.exe names itself $($details.ProductName) $($details.ProductVersion)"
          }

          [IO.File]::AppendAllText((Join-Path $app 'config.toml'),
            "`n[profile]`nname = `"$commander`"`n", [Text.UTF8Encoding]::new($false))
          $second = New-Game $yuri
          $code = Install $second
          if ($code -ne 0) { Get-Content $log; throw "upgrade failed with exit code $code" }
          $config = Read-Config
          if (-not $config.Contains((Ra2Dir $second))) { throw "upgrade did not write $(Ra2Dir $second)" }
          if ([regex]::Matches($config, '(?m)^ra2_dir =').Count -ne 1) { throw 'config.toml repeats ra2_dir' }
          if (-not $config.Contains("name = `"$commander`"")) { throw 'upgrade lost the [profile] name' }
          if ([IO.File]::ReadAllBytes((Join-Path $app 'config.toml'))[0] -eq 0xEF) {
            throw 'config.toml starts with a byte order mark'
          }

          $p = Start-Process (Join-Path $app 'unins000.exe') -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($p.ExitCode -ne 0) { throw "uninstall failed with exit code $($p.ExitCode)" }
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path (Join-Path $app 'unins000.exe')) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
          }
          if (Test-Path (Join-Path $app 'unins000.exe')) { throw 'uninstall did not finish' }
          if (Test-Path (Join-Path $app 'vera20k.exe')) { throw 'uninstall left vera20k.exe behind' }
          if (-not (Test-Path (Join-Path $app 'config.toml'))) { throw 'uninstall removed config.toml' }

          $eaGame = New-Game (Join-Path $env:ProgramFiles 'EA Games\Command and Conquer Red Alert II')
          $steam = Join-Path $root 'Steam'
          $library = Join-Path $root "library $yuri"
          $steamGame = New-Game "library $yuri\steamapps\common\Command & Conquer Red Alert II"
          New-Item -ItemType Directory -Force (Join-Path $steam 'steamapps') | Out-Null
          New-Item -Force 'HKCU:\Software\Valve\Steam' | Out-Null
          Set-ItemProperty 'HKCU:\Software\Valve\Steam' SteamPath ($steam -replace '\\', '/')
          $libraries = "`"libraryfolders`"`n{`n"
          foreach ($i in 0, 1) {
            $folder = @($steam, $library)[$i] -replace '\\', '\\'
            $libraries += "`t`"$i`"`n`t{`n`t`t`"path`"`t`t`"$folder`"`n`t`t`"label`"`t`t`"`"`n`t}`n"
          }
          [IO.File]::WriteAllText((Join-Path $steam 'steamapps\libraryfolders.vdf'), "$libraries}`n",
            [Text.UTF8Encoding]::new($false))
          $code = Install ''
          if ($code -ne 0) { Get-Content $log; throw "setup failed to find the Steam game: exit code $code" }
          Assert-Found $steamGame
          Remove-Item (Join-Path $steamGame '*.mix')
          $code = Install ''
          if ($code -ne 0) { Get-Content $log; throw "setup failed to find the EA app game: exit code $code" }
          Assert-Found $eaGame
          Write-Output 'Installer: refused, installed, upgraded, uninstalled and found the game as expected.'
      # Linux also gets the program as an AppImage: it keeps its files in
      # ~/.local/share/VERA20k and finds or asks for the Yuri's Revenge folder
      # on its first launch (.github/release/linux).
      - name: Linux AppImage
        if: runner.os == 'Linux'
        env:
          NAME: ${{ steps.package.outputs.name }}
        run: bash .github/release/linux/appimage.sh "dist/$NAME" "dist/$NAME.AppImage"
      # Check the image's contents and start the packaged program, so a broken
      # AppImage stops the nightly here instead of reaching players.
      - name: Test the Linux AppImage
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          NAME: ${{ steps.package.outputs.name }}
        run: |
          set -euo pipefail
          image="$(realpath "dist/$NAME.AppImage")"
          test -x "$image"
          work="$(mktemp -d)"
          (cd "$work" && "$image" --appimage-extract > /dev/null)
          root="$work/squashfs-root"
          test "$(readlink "$root/AppRun")" = usr/bin/vera20k
          cmp "$root/usr/bin/vera20k" "dist/$NAME/vera20k"
          test -f "$root/usr/share/doc/vera20k/README.txt"
          test -f "$root/vera20k.svg"
          test -f "$root/.DirIcon"
          desktop-file-validate "$root/vera20k.desktop"
          data="${XDG_DATA_HOME:-$HOME/.local/share}/VERA20k"
          rm -rf "$data"
          (cd / && APPIMAGE_EXTRACT_AND_RUN=1 "$image" -h > /dev/null)
          grep -q 'VERA20k .* starting' "$data/logs/ra2.log"
          echo 'Linux AppImage: complete, and starting in its data folder.'
      # macOS is intentionally not built here (see the workflow header).
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*-setup.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  # The library tests on each built platform, from the commit the archives were
  # built from. They do NOT gate the publish: a nightly's job is to ship the
  # newest code, so it publishes what built even if a test is failing that day.
  # This mirrors the MAINTENANCE DECISION in release.yml -- a capacity or test
  # failure should not discard the Windows and Linux builds we do have. To make
  # the nightly block on tests instead, add `test` to the publish job's `needs`.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    uses: ./.github/workflows/test.yml
    with:
      os: ${{ matrix.os }}

  publish:
    name: publish
    needs: [prepare, build]
    # "none" stops here, with the archives left as workflow artifacts.
    if: needs.prepare.outputs.publish != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # Signed SLSA build provenance: `gh attestation verify <archive>
      # --repo YuriPlanet/vera20k` proves an archive came from this workflow.
      id-token: write
      attestations: write
    steps:
      # Notes need real history to list commits since the previous release.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: actions/attest@v4
        with:
          subject-path: dist/vera20k-*
      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          # `gh release create TAG dist/*` hands each match to the uploader, so a
          # leftover directory (or a symlink) would fail or be skipped silently.
          # Assert the download really left only regular files.
          nonfile="$(find dist -mindepth 1 -not -type f -print)"
          if [ -n "$nonfile" ]; then
            echo "!! non-file entries in dist/, refusing to publish:" >&2
            echo "$nonfile" >&2
            exit 1
          fi
          cd dist
          sha256sum vera20k-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Write release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          STAMP: ${{ needs.prepare.outputs.stamp }}
          COMMIT: ${{ github.sha }}
          DIST: dist
        run: bash .github/release/notes.sh notes.md
      - name: Create the tag and the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          # Creating the tag here, before the release, keeps it pinned to the
          # commit that was actually built. `gh release create --verify-tag`
          # then refuses to invent a different target.
          bash .github/release/tag.sh "$TAG" "$GITHUB_SHA"

          # A nightly is a pre-release, so publishing it cannot make it the
          # repository's Latest release.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "VERA20k nightly $TAG" --notes-file notes.md dist/*
          echo "Published $TAG"
      - name: Prune old nightly builds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Enough to step back a few nightlies to find a regression.
          KEEP_NIGHTLY_BUILDS: 7
        run: |
          set -euo pipefail
          # Only published pre-releases with a nightly- tag qualify; the real
          # releases and dev builds are never deleted here.
          gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1000 \
            --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease
                     and (.tagName | test("^nightly-")))]
                  | sort_by(.createdAt) | reverse
                  | .[(env.KEEP_NIGHTLY_BUILDS | tonumber):][] | .tagName' \
            | while read -r old; do
                gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
                echo "Pruned nightly $old"
              done
